<header class="masthead"><div class="logo">SIDELENS ↗<small>TYPE STUDY / 中文阅读</small></div><a href="options.html?lang=zh-CN">返回设置预览 ↗</a></header>
<main>
<h1>先选读起来舒服的字。</h1>
<p class="intro">四款字体使用相同内容、配色与排版。LOGO 保持原样；正文默认常规字重，只加粗重点。字体选择只记录在本页。</p>
<section class="controls" aria-label="阅读排版设置">
<label class="control" for="size">正文字号 <input id="size" type="range" min="14" max="18" step="0.5" value="16"><output id="size-value" for="size">16 px</output></label>
<label class="control" for="leading">行距 <input id="leading" type="range" min="1.6" max="2.1" step="0.05" value="1.85"><output id="leading-value" for="leading">1.85</output></label>
<label class="control"><input id="heavy" type="checkbox">模拟整段加粗</label>
<button id="reset" type="button">恢复推荐排版</button>
</section>
<p class="hint">建议先保持 16px / 1.85 行距比较字体，再微调。勾选“模拟整段加粗”，可对比截图里偏粗的阅读效果。</p>
<div class="grid" id="choices"></div>
<section class="summary" aria-label="当前选择"><p id="selection" aria-live="polite">尚未选择字体。<small>选好后，可以直接在聊天里告诉我 A、B、C 或 D。</small></p><button class="copy" id="copy" type="button">复制当前方案</button></section>

<div class="meta">生成于 2026/10/27 00:37<span>28,416 tokens · Grok</span></div>
<div class="reading">
<h2>结论与可核实的信息</h2>
<p><strong>工具的定位不同，适合的任务也不同。</strong>阅读产品介绍时，可以先区分它是在浏览器里工作，还是需要在本机运行。名称相似，并不代表功能和使用条件相同。<span class="citation"> [1][2]</span></p>
<p>例如，部分工具支持搜索资料、整理日历和处理文档；另一些工具更侧重代码编辑与终端操作。<strong>“支持某项功能”与“能够稳定完成任务”是两件事。</strong></p>
<ul><li>先查看官方说明、发布日期和适用版本。</li><li>确认收费方式、权限范围，以及实际需要的配置。</li><li>遇到缺少依据的说法，保留不确定性。</li></ul>
<p>安装之前，建议检查 <code>README</code> 中的使用方法。尤其要区分“免费试用”“订阅内额度”和“按调用量计费”，避免把宣传用语当作长期承诺。<span class="citation"> [3]</span></p>
</div><div class="sample-action"><span>重新分析</span></div></div>
